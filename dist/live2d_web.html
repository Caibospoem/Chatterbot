<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="assets/image/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      body {
        background-image: url("assets/image/night.jpg");
        background-size: cover;
        background-repeat: no-repeat;
        background-position: center center;
        background-attachment: fixed;
        font-family: Arial, sans-serif;
      }
      #canvas2 {
        width: 60%;
        height: auto;
        margin: 30px auto;
        display: block;
        background-color: transparent;
      }
    </style>
    <script src="/assets/live2d_core/live2dcubismcore.min.js"></script>
    <script src="/assets/live2d_core/live2d.min.js"></script>
    <script src="/assets/live2d_core/pixi.min.js"></script>
    <title>ChatterBot</title>
    <script type="module" crossorigin src="/assets/live2d.js"></script>
  </head>
  <body>
    <div id="app"></div>
    <canvas id="canvas2"></canvas>

    <script>
      // 设置Canvas背景为透明
      document.addEventListener("DOMContentLoaded", function () {
        const canvasElement = document.getElementById("canvas2");
        if (canvasElement) {
          canvasElement.style.backgroundColor = "transparent";
        }
      });
    </script>
  </body>
</html>
